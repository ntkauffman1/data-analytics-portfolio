name: Wake Up Portfolio Apps

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  ping-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1 # THIS IS THE FIX: Runs one app at a time!
      matrix:
        url: [
          "https://data-analytics-portfolio-ntkauffman.streamlit.app/",
          "https://analyst-reference-guide-ntkauffman1.streamlit.app/"
        ]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install selenium webdriver-manager

      - name: Run Wakeup Script
        run: python keep_alive.py ${{ matrix.url }}

      - name: Commit performance log and screenshots
        if: always()
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add app_performance_log.csv
          git add error_*.png || echo "No errors to log"
          git commit -m "Update logs and debug screenshots [skip ci]" || exit 0
          git pull --rebase origin main
          git push

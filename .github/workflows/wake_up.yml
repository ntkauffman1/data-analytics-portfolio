name: Wake Up Portfolio Apps

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  ping-portfolio:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1 
      matrix:
        url: [
          "https://data-analytics-portfolio-ntkauffman.streamlit.app/",
          "https://analyst-reference-guide-ntkauffman1.streamlit.app/"
        ]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install selenium webdriver-manager

      - name: Refresh Repository 
        # This grabs Job 1's CSV update before Job 2 starts!
        run: git pull origin main

      - name: Run Wakeup Script
        run: python keep_alive.py ${{ matrix.url }}

      - name: Commit logs and screenshots
        if: always()
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 1. Add the CSV file
          git add app_performance_log.csv
          
          # 2. Add screenshots ONLY if they exist (the '|| true' prevents crashes)
          git add error_*.png || true
          
          # 3. Save the changes locally
          git commit -m "Update app logs [skip ci]" || echo "No changes to commit"
          
          # 4. Download any new data the other app just saved to prevent traffic jams
          git pull --rebase origin main
          
          # 5. Push everything back to your repo
          git push
